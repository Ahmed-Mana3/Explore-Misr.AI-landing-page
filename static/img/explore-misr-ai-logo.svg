<svg viewBox="0 0 1150 300" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="badgeBg" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0F2A4A"/>
      <stop offset="100%" stop-color="#081A30"/>
    </radialGradient>
    <linearGradient id="pyramidGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F6E3AE"/>
      <stop offset="55%" stop-color="#D9A94B"/>
      <stop offset="100%" stop-color="#B9812E"/>
    </linearGradient>
    <linearGradient id="pyramidShade" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#B9812E"/>
      <stop offset="100%" stop-color="#8C5F1F"/>
    </linearGradient>
    <radialGradient id="lensGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8FFCEF"/>
      <stop offset="45%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#0F8C82"/>
    </radialGradient>
    <linearGradient id="textAI" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#7EE8DC"/>
    </linearGradient>
  </defs>

  <!-- Icon badge -->
  <circle cx="150" cy="150" r="132" fill="url(#badgeBg)" stroke="#D9A94B" stroke-width="3"/>

  <!-- subtle radiating data/sun lines -->
  <g stroke="#D9A94B" stroke-width="2" opacity="0.35">
    <line x1="150" y1="34" x2="150" y2="10"/>
    <line x1="150" y1="266" x2="150" y2="290"/>
    <line x1="34" y1="150" x2="10" y2="150"/>
    <line x1="266" y1="150" x2="290" y2="150"/>
    <line x1="65" y1="65" x2="47" y2="47"/>
    <line x1="235" y1="65" x2="253" y2="47"/>
    <line x1="65" y1="235" x2="47" y2="253"/>
    <line x1="235" y1="235" x2="253" y2="253"/>
  </g>

  <!-- Pyramid -->
  <polygon points="150,78 224,206 76,206" fill="url(#pyramidGold)"/>
  <polygon points="150,78 224,206 178,206 150,120" fill="url(#pyramidShade)" opacity="0.55"/>
  <line x1="150" y1="78" x2="150" y2="206" stroke="#0F2A4A" stroke-width="2" opacity="0.4"/>

  <!-- Circuit facets on pyramid (tech overlay) -->
  <g stroke="#0F2A4A" stroke-width="1.6" opacity="0.5">
    <line x1="150" y1="78" x2="120" y2="140"/>
    <line x1="150" y1="78" x2="180" y2="140"/>
    <line x1="105" y1="167" x2="140" y2="167"/>
    <line x1="160" y1="167" x2="195" y2="167"/>
  </g>

  <!-- AI lens / Eye of the guide, sitting at the pyramid's base like a scanning lens -->
  <circle cx="150" cy="172" r="26" fill="url(#lensGlow)" stroke="#08303A" stroke-width="2"/>
  <circle cx="150" cy="172" r="9" fill="#08303A"/>
  <circle cx="145" cy="167" r="3" fill="#8FFCEF"/>

  <!-- small orbiting node suggesting AR/AI -->
  <circle cx="196" cy="132" r="5" fill="#2DD4BF"/>
  <circle cx="104" cy="132" r="4" fill="#F6E3AE"/>

  <!-- Wordmark (single line) -->
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="322" y="172" font-size="58" font-weight="700" fill="#0B1F3A">Explore Misr<tspan fill="url(#textAI)">.AI</tspan></text>
  </g>

  <!-- Tagline -->
  <text x="325" y="212" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="1.5" fill="#5B6B7C">
    YOUR PERSONAL AI TOUR GUIDE
  </text>
</svg>
