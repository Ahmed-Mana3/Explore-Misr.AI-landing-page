{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waitlist Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            dark: '#2a2118',
                            muted: '#5c4d3c',
                            sand: '#efe8d7',
                            sandDark: '#d4c5b0',
                            sandLight: '#fdfcfb',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-brand-sandLight text-brand-dark font-sans min-h-screen p-8">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold mb-6">Waitlist Management</h1>
        
        <div class="bg-white rounded-2xl border border-brand-sandDark/40 shadow-soft p-6">
            <h2 class="text-xl font-semibold mb-4">Total Entries: {{ numbers|length }}</h2>
            
            {% if numbers %}
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-brand-sandDark/30">
                            <th class="py-3 px-4 font-semibold text-brand-muted">#</th>
                            <th class="py-3 px-4 font-semibold text-brand-muted">Mobile Number</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for number in numbers %}
                        <tr class="border-b border-brand-sandDark/10 hover:bg-brand-sandLight/50 transition-colors">
                            <td class="py-3 px-4">{{ forloop.counter }}</td>
                            <td class="py-3 px-4 font-medium">{{ number }}</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            {% else %}
            <p class="text-brand-muted py-4">The waitlist is currently empty.</p>
            {% endif %}
        </div>
        
        <div class="mt-6 text-center">
            <a href="/" class="text-brand-muted hover:text-brand-dark font-medium underline">Back to Landing Page</a>
        </div>
    </div>
</body>
</html>
